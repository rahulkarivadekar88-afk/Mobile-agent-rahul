{"name": "Build APK", "on": ["push", "workflow_dispatch"],
"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"name": "Unzip project", "run": "unzip -o \"$(ls *.zip | head -1)\""},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.11.1"}},
{"name": "Build", "working-directory": "phone-agent", "run": "gradle assembleRelease --no-daemon"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "PhoneAgent-apk", "path": "phone-agent/app/build/outputs/apk/release/*.apk"}}
]}}}
